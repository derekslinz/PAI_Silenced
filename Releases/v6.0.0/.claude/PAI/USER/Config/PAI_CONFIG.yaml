# PAI Configuration — User
# Edit this file with your actual values. Never commit real credentials.
# The release builder scrubs this file from public releases.
# 
# Use environment variables or keychain for sensitive values.
# This file is loaded by hooks and skills at runtime.

# Anthropic (for inference)
# ANTHROPIC_API_KEY: ""  # set via env or keychain

# OpenAI (for some skills)
# OPENAI_API_KEY: ""

# GitHub (for releases, skills)
# GITHUB_TOKEN: ""

# Notion (for Migrate)
# NOTION_TOKEN: ""

# Apify (for Apify skill)
# APIFY_TOKEN: ""

# BrightData (for BrightData skill)
# BRIGHTDATA_TOKEN: ""

# FRED (for USMetrics)
# FRED_API_KEY: ""

# EIA (for USMetrics)
# EIA_API_KEY: ""

# Cleanvoice (for AudioEditor polish)
# CLEANVOICE_API_KEY: ""

# Telegram (for Pulse)
# TELEGRAM_BOT_TOKEN: ""
# TELEGRAM_CHAT_ID: ""

# Custom endpoints
# PAI_CUSTOM_ENDPOINT: ""

# Pulse settings
PULSE_PORT: 31337
PULSE_BIND_ALL: false

# Feature flags
ENABLE_TELEGRAM: false
ENABLE_IMESSAGE: false
ENABLE_DASHBOARD: true
ENABLE_HOOKS: true
