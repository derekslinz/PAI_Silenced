# Security Patterns — User
# Custom patterns for the SecurityPipeline inspectors.
# This file is loaded by PatternInspector at runtime.
# Add your own sensitive patterns here (API key formats, internal hostnames, etc.)
# The release builder scrubs this file from public releases.

patterns:
  # Custom API key patterns (prefix-based detection)
  - name: "custom-api-key"
    regex: "(?i)(api[_-]?key|secret[_-]?key|access[_-]?token)[\"']?\\s*[:=]\\s*[\"']?[a-zA-Z0-9_-]{20,}"
    severity: "critical"
    description: "Generic API key/secret pattern"

  # Internal hostnames
  - name: "internal-hostname"
    regex: "\\b(?:internal|prod|staging|dev|ci|admin|db|api|worker)\\.[a-z0-9-]+\\.(?:local|internal|corp|company)\\.com"
    severity: "high"
    description: "Internal service hostnames"

  # Database connection strings
  - name: "database-url"
    regex: "(?i)(postgres|mysql|mongodb|redis)://[^\\s\"'<>]{10,}"
    severity: "critical"
    description: "Database connection string"

  # Private keys
  - name: "private-key"
    regex: "-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
    severity: "critical"
    description: "Private key block"

  # AWS credentials
  - name: "aws-access-key"
    regex: "AKIA[0-9A-Z]{16}"
    severity: "critical"
    description: "AWS Access Key ID"

  - name: "aws-secret-key"
    regex: "(?i)aws[_-]?secret[_-]?access[_-]?key[\"']?\\s*[:=]\\s*[\"']?[A-Za-z0-9/+=]{40}"
    severity: "critical"
    description: "AWS Secret Access Key"

  # Generic tokens
  - name: "bearer-token"
    regex: "(?i)bearer\\s+[a-zA-Z0-9._-]{20,}"
    severity: "high"
    description: "Bearer token in header or text"

  # JWT tokens
  - name: "jwt-token"
    regex: "eyJ[a-zA-Z0-9_-]+\\.eyJ[a-zA-Z0-9_-]+\\.[a-zA-Z0-9._-]+"
    severity: "high"
    description: "JWT token"

# Allowlist — patterns that are intentionally in code/docs and should not trigger
allowlist:
  - pattern: "AKIA[0-9A-Z]{16}"
    context: "example|test|placeholder|sample|xxx"
    description: "Example AWS keys in documentation"

  - pattern: "-----BEGIN.*PRIVATE KEY-----"
    context: "example|test|placeholder|sample"
    description: "Example private keys in documentation"
